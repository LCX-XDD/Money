<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- ✅ 核心：全局禁止缩放和双击放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#dcebff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101219">
  <title>LCX的工资</title>

  <!-- iOS 桌面图标 -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn-icons-png.flaticon.com/512/4969/4969649.png">
  <!-- 浏览器标签页小图标 -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/4969/4969649.png">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 金币雨背景层：back 在卡片后（多），front 在卡片前（少） -->
  <div id="money-rain-back" class="money-layer" aria-hidden="true"></div>
  <div id="money-rain-front" class="money-layer" aria-hidden="true"></div>
  <!-- 用户页面内容容器 -->
  <div id="user-view">
    <!-- 主窗口 -->
    <div class="white-window">
      <h1 class="title">LCX</h1>
      
      <!-- 顶部 周期进度 卡片 -->
      <div class="progress-window top-progress-window">
        <h3 class="progress-label">抓🐷进度</h3>
        <!-- 顶部进度圆环（固定ID：top-progress） -->
        <div class="progress-circle mini-progress" id="top-progress">
          <svg class="t-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="t-ring-track" cx="50" cy="50" r="45"></circle>
            <circle class="t-ring-bar" cx="50" cy="50" r="45"></circle>
          </svg>
          <div class="progress-text" id="cycle-progress-text">0%</div>
        </div>
      </div>
      
      <!-- 蓝色总工资卡片 -->
      <div class="total-wage-box">
        <div class="loading-overlay"><div class="loading-spinner"></div></div>
        <button class="refresh-btn" id="refresh-data-btn">↻</button>
        <div class="cycle-text" id="current-cycle"></div>
        <div class="total-wage-label">悬赏金</div>
        <div class="total-wage-value" id="total-wage-num">0.00</div>
        <button class="btn-detail" id="detail-btn">查看详细信息</button>
      </div>

      <!-- 下方 抓捕进度 卡片 -->
      <div class="progress-window">
        <h3 class="progress-label">悬赏💵进度</h3>
        <!-- 底部进度圆环（固定ID：bottom-progress） -->
        <div class="progress-circle" id="bottom-progress">
          <svg class="t-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="t-ring-track" cx="50" cy="50" r="45"></circle>
            <circle class="t-ring-bar" cx="50" cy="50" r="45"></circle>
          </svg>
          <div class="progress-text" id="progress-text">0%</div>
        </div>
      </div>

      <!-- 歌词显示区 -->
      <div class="lyrics-box" id="lyrics-box">
        <div class="lyrics-track" id="lyrics-track">
          <div class="lyric-line lyric-prev" id="lyric-prev"></div>
          <div class="lyric-line lyric-current" id="lyric-current">♪ 开始播放后显示歌词</div>
          <div class="lyric-line lyric-next" id="lyric-next"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 管理员页面 -->
  <div id="admin-view" class="hidden">
    <!-- ✅ 管理员日历：新左右按钮布局，ID唯一 -->
    <div class="calendar-container">
      <!-- 左：上一月按钮 -->
      <button id="admin-prev-month-btn" class="calendar-btn prev-btn">‹</button>
      
      <!-- 中间：日历主体 -->
      <div class="calendar-wrap">
        <div class="calendar-head">
          <span id="admin-calendar-title"></span>
        </div>
        <div class="calendar-week">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="admin-calendar-body" class="calendar-body"></div>
      </div>
      
      <!-- 右：下一月按钮 -->
      <button id="admin-next-month-btn" class="calendar-btn next-btn">›</button>
    </div>

    <!-- 记录表单 -->
    <input type="date" id="record-date" class="form-input">
    <select id="record-shift" class="form-input">
      <option value="">请选择班次</option>
      <option value="早班">早班</option>
      <option value="中班">中班</option>
      <option value="晚班">晚班</option>
      <option value="拼班">拼班</option>
      <option value="休息">休息</option>
    </select>

    <div id="normal-time-row" class="time-row hidden">
      <label>上班时间：</label>
      <select id="shift-start" class="time-select"></select>
    </div>
    <div id="normal-end-row" class="time-row hidden">
      <label>下班时间：</label>
      <select id="shift-end" class="time-select"></select>
    </div>
    <div id="part2-start-row" class="time-row hidden">
      <label>第二段上班：</label>
      <select id="shift-start2" class="time-select"></select>
    </div>
    <div id="part2-end-row" class="time-row hidden">
      <label>第二段下班：</label>
      <select id="shift-end2" class="time-select"></select>
    </div>
<div id="meal-wrap" class="time-row hidden">
  <label>饭点：</label>
  <!-- 只保留开始/结束饭点时间输入框；只填开始时默认按1小时饭点扣除 -->
  <div style="display:flex;margin-left:8px;gap:6px;align-items:center;flex:1;">
    <input id="meal-start" class="time-select" type="time" style="flex:1;min-width:0;">
    <span>至</span>
    <input id="meal-end" class="time-select" type="time" style="flex:1;min-width:0;">
  </div>
</div>



    <div class="time-tip" id="work-hours-tip">有效工时：0 小时</div>
    <input type="text" id="record-money" class="form-input" placeholder="当日基本工资（自动计算）" readonly>
    <input type="text" id="record-allowance" class="form-input" placeholder="加班补贴（自动）">
    <input type="text" id="record-remark" class="form-input" placeholder="备注信息">
    <input type="hidden" id="edit-id">

    <button id="save-btn" class="btn-primary">保存记录</button>
    <button id="cancel-edit-btn" class="btn-danger" style="display: none;">取消编辑</button>
    <div class="btn-back">
      <button id="back-user">返回用户页</button>
    </div>

    <!-- 管理列表 -->
    <h3 class="sub-title">管理列表</h3>
    <div class="list" id="admin-list"></div>
  </div>

  <!-- 管理员入口（右下角） -->
  <div id="admin-entrance">LCX</div>

  <!-- 登录弹窗 -->
  <div id="login-overlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-content">
        <div class="modal-title">管理员登录</div>
        <input type="password" id="admin-pwd-input" class="modal-input" placeholder="请输入管理员密码">
        <div class="modal-btn-group">
          <button id="login-cancel" class="modal-btn cancel">取消</button>
          <button id="login-confirm" class="modal-btn confirm">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情抽屉（第一步：本期详情） -->
  <div id="detail-overlay" class="modal-overlay drawer-overlay">
    <div class="modal-box drawer-panel">
      <div class="drawer-head">
        <div class="drawer-head-top">
          <span class="drawer-title">本期详情</span>
          <button class="drawer-close" id="detail-x" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M7 7L17 17M17 7L7 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="drawer-body" id="detail-body">
        <div class="detail-item">
          <span>总工时</span>
          <span id="stat-work-hours">0 小时</span>
        </div>
        <div class="detail-item">
          <span>出勤天数</span>
          <span id="stat-work-days">0 天</span>
        </div>
        <div class="detail-item">
          <span>21点下班</span>
          <span id="stat-21h-days">0 天</span>
        </div>
        <div class="detail-item">
          <span>22点下班</span>
          <span id="stat-22h-days">0 天</span>
        </div>
        <div class="detail-item">
          <span>23点下班</span>
          <span id="stat-23h-days">0 天</span>
        </div>
        <div class="detail-item">
          <span>总基本工资</span>
          <span id="stat-base-money">¥0.00</span>
        </div>
        <div class="detail-item">
          <span>总加班补贴</span>
          <span id="stat-allowance">¥0.00</span>
        </div>
        <div class="detail-list-title">历史周期</div>
        <div id="cycle-group-list"></div>
      </div>
      <button class="t-backtop" id="detail-backtop" type="button" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 18V6M12 6L6.5 11.5M12 6L17.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- 周期详情抽屉（第二步：从本期详情里点历史周期） -->
  <div id="cycle-detail-overlay" class="modal-overlay drawer-overlay">
    <div class="modal-box drawer-panel">
      <div class="drawer-head">
        <div class="drawer-head-top">
          <nav class="t-breadcrumb" aria-label="面包屑">
            <button class="crumb crumb-link" id="cycle-crumb-back" type="button">本期详情</button>
            <span class="crumb-sep">/</span>
            <span class="crumb crumb-current" id="cycle-detail-title"></span>
          </nav>
          <button class="drawer-close" id="cycle-detail-x" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M7 7L17 17M17 7L7 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="drawer-body" id="cycle-detail-body">
        <div id="cycle-detail-record-list"></div>
        <div id="cycle-detail-pager"></div>
      </div>
      <button class="t-backtop" id="cycle-detail-backtop" type="button" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 18V6M12 6L6.5 11.5M12 6L17.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- 周期工资统计弹窗 -->
  <div id="cycle-total-overlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-content">
        <div class="modal-title" id="cycle-total-title"></div>
        <div style="padding:20px;text-align:center;" id="cycle-total-info"></div>
      </div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <!-- 背景音乐播放器（可拖动圆形按钮，点击弹出面板） -->
  <div id="music-player">
    <div id="music-panel" class="hidden">
      <div id="music-panel-title">正在播放</div>
      <div id="music-list">
        <div class="music-item active" data-src="./music/M1.mp3" data-name="M1">
          <span class="music-item-name">M1</span>
          <span class="music-item-time" id="music-time">00:00 / 00:00</span>
        </div>
      </div>
      <div id="music-controls">
        <button id="music-prev" type="button" aria-label="上一首">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6v12M18 6L9 12l9 6V6z" fill="currentColor"/></svg>
        </button>
        <button id="music-play-pause" type="button" aria-label="播放/暂停">
          <svg id="icon-pause" viewBox="0 0 24 24" width="16" height="16"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          <svg id="icon-play" viewBox="0 0 24 24" width="16" height="16" style="display:none"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>
        </button>
        <div id="music-progress-bar">
          <div id="music-progress-fill"></div>
        </div>
        <button id="music-next" type="button" aria-label="下一首">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 6v12M6 6l9 6-9 6V6z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <button id="music-toggle" type="button" aria-label="播放/暂停音乐">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
        <circle cx="18.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
      </svg>
    </button>
  </div>
  <audio id="music-audio" preload="auto"></audio>

  <!-- LeanCloud SDK -->
  <script src="./js/av-min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
